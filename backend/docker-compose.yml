services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      CONTAINER_ROLE: app
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["media:/var/www/html/storage/app/public"]

  queue:
    build: .
    env_file: .env
    environment:
      CONTAINER_ROLE: queue
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["media:/var/www/html/storage/app/public"]

  scheduler:
    build: .
    env_file: .env
    environment:
      CONTAINER_ROLE: scheduler
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mytijaara
      MYSQL_USER: mytijaara
      MYSQL_PASSWORD: change-me-local
      MYSQL_ROOT_PASSWORD: change-me-root-local
    ports: ["3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange-me-root-local"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  redis-data:
  media:
