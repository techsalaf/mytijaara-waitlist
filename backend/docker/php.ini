; MyTijaara API — production PHP overrides (loaded after the base php.ini).

; --- limits ------------------------------------------------------------------
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 21M
max_execution_time = 60

; --- errors: never leak to the client in production --------------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; --- opcache: compile once, serve from memory --------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; validate_timestamps=0 assumes an immutable image (code baked in at build).
; Rebuild the image to ship code changes.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
