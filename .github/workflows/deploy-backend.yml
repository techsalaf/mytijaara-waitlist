name: Deploy Laravel Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      composer: ${{ steps.changes.outputs.composer }}
      migrate: ${{ steps.changes.outputs.migrate }}
      config: ${{ steps.changes.outputs.config }}
      routes: ${{ steps.changes.outputs.routes }}
      views: ${{ steps.changes.outputs.views }}
      queue: ${{ steps.changes.outputs.queue }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: changes
        name: Detect Changed Backend Files
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD)

          echo "=============================="
          echo "Changed files:"
          echo "$CHANGED"
          echo "=============================="

          composer=false
          migrate=false
          config=false
          routes=false
          views=false
          queue=false

          while IFS= read -r file; do
            case "$file" in
              backend/composer.json|backend/composer.lock)
                composer=true
                ;;
              backend/database/migrations/*)
                migrate=true
                ;;
              backend/config/*|backend/bootstrap/*)
                config=true
                ;;
              backend/routes/*)
                routes=true
                ;;
              backend/resources/views/*)
                views=true
                ;;
              backend/app/Jobs/*|backend/app/Listeners/*)
                queue=true
                ;;
            esac
          done <<< "$CHANGED"

          echo "composer=$composer" >> $GITHUB_OUTPUT
          echo "migrate=$migrate" >> $GITHUB_OUTPUT
          echo "config=$config" >> $GITHUB_OUTPUT
          echo "routes=$routes" >> $GITHUB_OUTPUT
          echo "views=$views" >> $GITHUB_OUTPUT
          echo "queue=$queue" >> $GITHUB_OUTPUT

  deploy:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Namecheap
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAMECHEAP_SSH_HOST }}
          username: ${{ secrets.NAMECHEAP_SSH_USER }}
          key: ${{ secrets.NAMECHEAP_SSH_KEY }}
          port: 21098
          timeout: 60s
          command_timeout: 30m
          script_stop: true

script: |
  #!/bin/bash
  set -ex
  trap 'echo "❌ ERROR at line $LINENO (exit code $?)"' ERR

  REPO="/home/mytijaaracp/repo"
  APP="/home/mytijaaracp/api"

  echo "========================================"
  echo "🚀 MyTijaara Backend Deployment Started"
  echo "========================================"

  cd "$REPO"
  git fetch origin main
  git reset --hard origin/main

  rsync -az --delete-delay --checksum \
    --exclude=".env" \
    --exclude="storage/" \
    --exclude="vendor/" \
    --exclude=".git/" \
    "$REPO/backend/" \
    "$APP/"

  cd "$APP"
  echo "✅ Backend synced."

  # Use booleans from detect job
  COMPOSER="${{ needs.detect.outputs.composer }}"
  RUN_MIGRATE="${{ needs.detect.outputs.migrate }}"
  RUN_CONFIG="${{ needs.detect.outputs.config }}"
  RUN_ROUTES="${{ needs.detect.outputs.routes }}"
  RUN_VIEWS="${{ needs.detect.outputs.views }}"
  RUN_QUEUE="${{ needs.detect.outputs.queue }}"

  # Composer
  [ "$COMPOSER" = "true" ] && {
    echo "📦 Installing Composer..."
    php ~/composer.phar install --no-dev --prefer-dist --optimize-autoloader --no-interaction
  } || echo "⏩ Composer skipped."

  # Config cache
  [ "$RUN_CONFIG" = "true" ] && {
    echo "⚙️ Caching config..."
    php artisan config:cache
  } || echo "⏩ Config cache skipped."

  # Route cache
  [ "$RUN_ROUTES" = "true" ] && {
    echo "🛣️ Caching routes..."
    php artisan route:cache
  } || echo "⏩ Route cache skipped."

  # View cache
  [ "$RUN_VIEWS" = "true" ] && {
    echo "🖼️ Caching views..."
    php artisan view:cache
  } || echo "⏩ View cache skipped."

  # Migrations
  [ "$RUN_MIGRATE" = "true" ] && {
    echo "🗄️ Running migrations..."
    php artisan migrate --force
  } || echo "⏩ No migrations."

  # Queue restart
  [ "$RUN_QUEUE" = "true" ] && {
    echo "🔄 Restarting queue..."
    php artisan queue:restart || true
  } || echo "⏩ Queue restart skipped."

  # Permissions
  chmod -R 775 storage bootstrap/cache

  echo "========================================"
  echo "🎉 Deployment completed successfully!"
  echo "========================================"