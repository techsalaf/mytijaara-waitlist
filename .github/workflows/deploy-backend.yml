name: Deploy Laravel Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Namecheap
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAMECHEAP_SSH_HOST }}
          username: ${{ secrets.NAMECHEAP_SSH_USER }}
          key: ${{ secrets.NAMECHEAP_SSH_KEY }}
          port: 21098
          timeout: 60s
          command_timeout: 30m
          script_stop: true

          script: |
            set -e

            REPO=/home/mytijaaracp/repo
            APP=/home/mytijaaracp/api

            ##########################################
            # Clone repo first time
            ##########################################

            if [ ! -d "$REPO/.git" ]; then
              git clone https://github.com/techsalaf/mytijaara-waitlist.git "$REPO"
            fi

            cd "$REPO"

            OLD_COMMIT=$(git rev-parse HEAD)

            git fetch origin main
            git reset --hard origin/main

            NEW_COMMIT=$(git rev-parse HEAD)

            CHANGED=$(git diff --name-only $OLD_COMMIT $NEW_COMMIT)

            echo "Changed files:"
            echo "$CHANGED"

            ##########################################
            # Sync backend only
            ##########################################

            rsync -a --delete \
              --exclude=.env \
              --exclude=storage \
              --exclude=vendor \
              --exclude=.git \
              "$REPO/backend/" \
              "$APP/"

            cd "$APP"

            ##########################################
            # Composer
            ##########################################

            if echo "$CHANGED" | grep -Eq '^backend/(composer\.json|composer\.lock)$'; then
              echo "Running Composer..."
              php ~/composer.phar install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --no-interaction
            else
              echo "Composer skipped."
            fi

            ##########################################
            # Config Cache
            ##########################################

            if echo "$CHANGED" | grep -Eq '^backend/config/|^backend/bootstrap/'; then
              php artisan config:cache
            fi

            ##########################################
            # Route Cache
            ##########################################

            if echo "$CHANGED" | grep -Eq '^backend/routes/'; then
              php artisan route:cache
            fi

            ##########################################
            # View Cache
            ##########################################

            if echo "$CHANGED" | grep -Eq '^backend/resources/views/'; then
              php artisan view:cache
            fi

            ##########################################
            # Migration
            ##########################################

            if echo "$CHANGED" | grep -Eq '^backend/database/migrations/'; then
              php artisan migrate --force
            else
              echo "No migrations."
            fi

            ##########################################
            # Restart queues if needed
            ##########################################

            if echo "$CHANGED" | grep -Eq '^backend/app/Jobs/|^backend/app/Listeners/'; then
              php artisan queue:restart || true
            fi

            ##########################################
            # Permissions
            ##########################################

            chmod -R 775 storage bootstrap/cache

            echo "Deployment completed successfully."