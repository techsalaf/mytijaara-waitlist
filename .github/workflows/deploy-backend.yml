name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      composer: ${{ steps.changes.outputs.composer }}
      migrate: ${{ steps.changes.outputs.migrate }}
      config: ${{ steps.changes.outputs.config }}
      routes: ${{ steps.changes.outputs.routes }}
      views: ${{ steps.changes.outputs.views }}
      queue: ${{ steps.changes.outputs.queue }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD || git diff --name-only HEAD || echo "")

          echo "Changed files:"
          echo "$CHANGED"

          composer=false
          migrate=false
          config=true
          routes=true
          views=true
          queue=false

          while IFS= read -r file; do
            case "$file" in

              backend/composer.json|backend/composer.lock)
                composer=true
                ;;

              backend/database/migrations/*)
                migrate=true
                ;;

              backend/app/Jobs/*|backend/app/Listeners/*)
                queue=true
                ;;

            esac
          done <<< "$CHANGED"

          echo "composer=$composer" >> $GITHUB_OUTPUT
          echo "migrate=$migrate" >> $GITHUB_OUTPUT
          echo "config=$config" >> $GITHUB_OUTPUT
          echo "routes=$routes" >> $GITHUB_OUTPUT
          echo "views=$views" >> $GITHUB_OUTPUT
          echo "queue=$queue" >> $GITHUB_OUTPUT

  deploy:
    needs: detect

    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAMECHEAP_SSH_HOST }}
          username: ${{ secrets.NAMECHEAP_SSH_USER }}
          key: ${{ secrets.NAMECHEAP_SSH_KEY }}
          port: 21098
          timeout: 60s
          command_timeout: 30m
          script_stop: true

          envs: COMPOSER,RUN_MIGRATE,RUN_CONFIG,RUN_ROUTES,RUN_VIEWS,RUN_QUEUE

          env: |
            COMPOSER=${{ needs.detect.outputs.composer }}
            RUN_MIGRATE=${{ needs.detect.outputs.migrate }}
            RUN_CONFIG=${{ needs.detect.outputs.config }}
            RUN_ROUTES=${{ needs.detect.outputs.routes }}
            RUN_VIEWS=${{ needs.detect.outputs.views }}
            RUN_QUEUE=${{ needs.detect.outputs.queue }}

          script: |
            set -e

            REPO=/home/mytijaaracp/repo
            APP=/home/mytijaaracp/api

            echo "Updating repository..."

            cd "$REPO"

            git fetch origin main
            git reset --hard origin/main

            echo "Syncing backend..."

            rsync -az --delete-delay \
              --exclude=.env \
              --exclude=storage/ \
              --exclude=vendor/ \
              --exclude=.git/ \
              "$REPO/backend/" \
              "$APP/"

            cd "$APP"

            php artisan storage:link || true

            if [ "$COMPOSER" = "true" ]; then
              echo "Running Composer..."
              php ~/composer.phar install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --no-interaction
            fi

            php artisan optimize:clear || true

            if [ "$RUN_CONFIG" = "true" ]; then
              php artisan config:cache
            fi

            if [ "$RUN_ROUTES" = "true" ]; then
              php artisan route:cache
            fi

            if [ "$RUN_VIEWS" = "true" ]; then
              php artisan view:cache
            fi

            if [ "$RUN_MIGRATE" = "true" ]; then
              php artisan migrate --force
            fi

            if [ "$RUN_QUEUE" = "true" ]; then
              php artisan queue:restart || true
            fi

            chmod -R 775 storage bootstrap/cache

            echo "Deployment completed successfully."