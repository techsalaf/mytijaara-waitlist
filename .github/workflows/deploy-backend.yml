script: |
  set -ex
  trap 'echo "❌ ERROR at line $LINENO (exit $?)"' ERR

  REPO=/home/mytijaaracp/repo
  APP=/home/mytijaaracp/api

  # ----------------------------------------------------------
  # 📥 Update repository
  # ----------------------------------------------------------
  echo "🔄 Updating repository..."
  cd "$REPO"
  git fetch origin main
  git reset --hard origin/main

  # ----------------------------------------------------------
  # 📂 Ensure application directory exists
  # ----------------------------------------------------------
  echo "📁 Checking/creating application directory..."
  mkdir -p "$APP"
  ls -ld "$APP"

  # ----------------------------------------------------------
  # 📂 Sync backend files (errors will be shown)
  # ----------------------------------------------------------
  echo "📂 Syncing backend files to application directory..."
  rsync -az --delete-delay \
    --exclude=.env \
    --exclude=storage/ \
    --exclude=vendor/ \
    --exclude=.git/ \
    "$REPO/backend/" \
    "$APP/" \
    2>&1

  cd "$APP"
  echo "✅ Sync completed."

  # ----------------------------------------------------------
  # 📦 Composer (if needed)
  # ----------------------------------------------------------
  if [ "$COMPOSER" = "true" ]; then
    echo "📦 Installing Composer dependencies..."
    php ~/composer.phar install \
      --no-dev --prefer-dist --optimize-autoloader --no-interaction
  else
    echo "⏩ Composer skipped."
  fi

  # ----------------------------------------------------------
  # ⚙️ Config cache
  # ----------------------------------------------------------
  if [ "$RUN_CONFIG" = "true" ]; then
    echo "⚙️ Caching config..."
    php artisan config:cache
  else
    echo "⏩ Config cache skipped."
  fi

  # ----------------------------------------------------------
  # 🛣️ Route cache
  # ----------------------------------------------------------
  if [ "$RUN_ROUTES" = "true" ]; then
    echo "🛣️ Caching routes..."
    php artisan route:cache
  else
    echo "⏩ Route cache skipped."
  fi

  # ----------------------------------------------------------
  # 🖼️ View cache
  # ----------------------------------------------------------
  if [ "$RUN_VIEWS" = "true" ]; then
    echo "🖼️ Caching views..."
    php artisan view:cache
  else
    echo "⏩ View cache skipped."
  fi

  # ----------------------------------------------------------
  # 🗄️ Migrations
  # ----------------------------------------------------------
  if [ "$RUN_MIGRATE" = "true" ]; then
    echo "🗄️ Running migrations..."
    php artisan migrate --force
  else
    echo "⏩ Migrations skipped."
  fi

  # ----------------------------------------------------------
  # 🔄 Queue restart
  # ----------------------------------------------------------
  if [ "$RUN_QUEUE" = "true" ]; then
    echo "🔄 Restarting queue workers..."
    php artisan queue:restart || true
  else
    echo "⏩ Queue restart skipped."
  fi

  # ----------------------------------------------------------
  # 🔐 Permissions
  # ----------------------------------------------------------
  echo "🔐 Setting permissions..."
  chmod -R 775 storage bootstrap/cache

  # ----------------------------------------------------------
  # ✅ Done
  # ----------------------------------------------------------
  echo "✅ Deployment completed successfully!"