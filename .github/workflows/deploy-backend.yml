name: Deploy Laravel Backend to Namecheap

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Namecheap via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAMECHEAP_SSH_HOST }}
          port: 21098
          username: ${{ secrets.NAMECHEAP_SSH_USER }}
          key: ${{ secrets.NAMECHEAP_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            cd /home/mytijaaracp/api

            echo "==> Updating code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Syncing backend contents..."
            rsync -av \
              --exclude='.env' \
              --exclude='storage/' \
              --exclude='vendor/' \
              --exclude='.git/' \
              --exclude='vendor-from-claude/' \
              /home/mytijaaracp/api/backend/ \
              /home/mytijaaracp/api/

            rm -rf /home/mytijaaracp/api/backend/

            composer install --no-dev --optimize-autoloader --no-interaction

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force

            chmod -R 775 storage bootstrap/cache

            echo "Deployment complete."