name: Deploy Laravel Backend to Namecheap

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Namecheap via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAMECHEAP_SSH_HOST }}
          port: 21098
          username: ${{ secrets.NAMECHEAP_SSH_USER }}
          key: ${{ secrets.NAMECHEAP_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            cd /home/mytijaaracp/api

            echo "=============================="
            echo "Fetching latest code..."
            echo "=============================="

            git fetch origin main

            PREVIOUS=$(git rev-parse HEAD)

            git reset --hard origin/main

            CURRENT=$(git rev-parse HEAD)

            echo "Previous: $PREVIOUS"
            echo "Current : $CURRENT"

            echo ""
            echo "Syncing backend..."

            rsync -a --delete \
                --exclude='.env' \
                --exclude='vendor/' \
                --exclude='storage/' \
                --exclude='.git/' \
                backend/ ./

            echo ""

            CHANGED=$(git diff --name-only $PREVIOUS $CURRENT)

            echo "Changed files:"
            echo "$CHANGED"

            ##################################################
            # Composer
            ##################################################

            if echo "$CHANGED" | grep -Eq '^backend/(composer\.json|composer\.lock)$'
            then
                echo ""
                echo "Running Composer..."
                php ~/composer.phar install \
                    --no-dev \
                    --prefer-dist \
                    --optimize-autoloader \
                    --no-interaction
            else
                echo ""
                echo "Composer skipped."
            fi

            ##################################################
            # Config Cache
            ##################################################

            if echo "$CHANGED" | grep -Eq '^backend/config/|^backend/bootstrap/|^backend/\.env\.example'
            then
                echo "Caching config..."
                php artisan config:cache
            fi

            ##################################################
            # Route Cache
            ##################################################

            if echo "$CHANGED" | grep -Eq '^backend/routes/'
            then
                echo "Caching routes..."
                php artisan route:cache
            fi

            ##################################################
            # View Cache
            ##################################################

            if echo "$CHANGED" | grep -Eq '^backend/resources/views/'
            then
                echo "Caching views..."
                php artisan view:cache
            fi

            ##################################################
            # Migrations
            ##################################################

            if echo "$CHANGED" | grep -Eq '^backend/database/migrations/'
            then
                echo "Running migrations..."
                php artisan migrate --force
            else
                echo "No migrations."
            fi

            ##################################################
            # Permissions
            ##################################################

            chmod -R 775 storage bootstrap/cache

            echo ""
            echo "Deployment completed successfully!"