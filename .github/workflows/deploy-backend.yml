name: Deploy Laravel Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Namecheap
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAMECHEAP_SSH_HOST }}
          username: ${{ secrets.NAMECHEAP_SSH_USER }}
          key: ${{ secrets.NAMECHEAP_SSH_KEY }}
          port: 21098
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            REPO="/home/mytijaaracp/repo"
            APP="/home/mytijaaracp/api"

            echo "==> Updating repository..."
            cd "$REPO"

            OLD_COMMIT=$(git rev-parse HEAD)

            git fetch origin main
            git reset --hard origin/main

            NEW_COMMIT=$(git rev-parse HEAD)

            CHANGED=$(git diff --name-only "$OLD_COMMIT" "$NEW_COMMIT")

            echo "===================================="
            echo "Changed files:"
            printf "%s\n" "$CHANGED"
            echo "===================================="

            echo "==> Syncing backend..."
            rsync -az --delete-delay \
              --exclude=".env" \
              --exclude="storage/" \
              --exclude="vendor/" \
              --exclude=".git/" \
              "$REPO/backend/" "$APP/"

            cd "$APP"

            ##############################################
            # Composer
            ##############################################
            if printf "%s\n" "$CHANGED" | grep -q "^backend/composer\.json\|^backend/composer\.lock"; then
              echo "Running Composer..."
              php ~/composer.phar install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --no-interaction
            else
              echo "Skipping Composer."
            fi

            ##############################################
            # Config Cache
            ##############################################
            if printf "%s\n" "$CHANGED" | grep -q "^backend/config/\|^backend/bootstrap/"; then
              echo "Caching config..."
              php artisan config:cache
            fi

            ##############################################
            # Route Cache
            ##############################################
            if printf "%s\n" "$CHANGED" | grep -q "^backend/routes/"; then
              echo "Caching routes..."
              php artisan route:cache
            fi

            ##############################################
            # View Cache
            ##############################################
            if printf "%s\n" "$CHANGED" | grep -q "^backend/resources/views/"; then
              echo "Caching views..."
              php artisan view:cache
            fi

            ##############################################
            # Migration
            ##############################################
            if printf "%s\n" "$CHANGED" | grep -q "^backend/database/migrations/"; then
              echo "Running migrations..."
              php artisan migrate --force
            else
              echo "No migrations."
            fi

            ##############################################
            # Queue Restart
            ##############################################
            if printf "%s\n" "$CHANGED" | grep -q "^backend/app/Jobs/\|^backend/app/Listeners/"; then
              echo "Restarting queues..."
              php artisan queue:restart || true
            fi

            ##############################################
            # Permissions
            ##############################################
            chmod -R 775 storage bootstrap/cache

            echo ""
            echo "✅ Deployment completed successfully."