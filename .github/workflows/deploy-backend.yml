name: 🚀 Deploy Laravel Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      composer: ${{ steps.changes.outputs.composer }}
      migrate: ${{ steps.changes.outputs.migrate }}
      config: ${{ steps.changes.outputs.config }}
      routes: ${{ steps.changes.outputs.routes }}
      views: ${{ steps.changes.outputs.views }}
      queue: ${{ steps.changes.outputs.queue }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed for git diff

      - name: 🔍 Detect changed backend files
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD)

          echo "📂 Changed files:"
          echo "$CHANGED"

          # Initialize flags
          composer=false
          migrate=false
          config=false
          routes=false
          views=false
          queue=false

          # Loop through changed files and set flags
          while IFS= read -r file; do
            case "$file" in
              backend/composer.json|backend/composer.lock)
                composer=true
                ;;
              backend/database/migrations/*)
                migrate=true
                ;;
              backend/config/*|backend/bootstrap/*)
                config=true
                ;;
              backend/routes/*)
                routes=true
                ;;
              backend/resources/views/*)
                views=true
                ;;
              backend/app/Jobs/*|backend/app/Listeners/*)
                queue=true
                ;;
            esac
          done <<< "$CHANGED"

          # Output flags for next job
          echo "composer=$composer" >> $GITHUB_OUTPUT
          echo "migrate=$migrate" >> $GITHUB_OUTPUT
          echo "config=$config" >> $GITHUB_OUTPUT
          echo "routes=$routes" >> $GITHUB_OUTPUT
          echo "views=$views" >> $GITHUB_OUTPUT
          echo "queue=$queue" >> $GITHUB_OUTPUT

  deploy:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 SSH Deploy to Namecheap
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAMECHEAP_SSH_HOST }}
          username: ${{ secrets.NAMECHEAP_SSH_USER }}
          key: ${{ secrets.NAMECHEAP_SSH_KEY }}
          port: 21098
          timeout: 60s
          command_timeout: 30m
          script_stop: true

          # Environment variables passed to the remote script
          envs: COMPOSER,RUN_MIGRATE,RUN_CONFIG,RUN_ROUTES,RUN_VIEWS,RUN_QUEUE

          env: |
            COMPOSER=${{ needs.detect.outputs.composer }}
            RUN_MIGRATE=${{ needs.detect.outputs.migrate }}
            RUN_CONFIG=${{ needs.detect.outputs.config }}
            RUN_ROUTES=${{ needs.detect.outputs.routes }}
            RUN_VIEWS=${{ needs.detect.outputs.views }}
            RUN_QUEUE=${{ needs.detect.outputs.queue }}

          script: |
            set -e  # exit on any failure

            REPO=/home/mytijaaracp/repo
            APP=/home/mytijaaracp/api

            # ----------------------------------------------------------
            # 📥 Update repository
            # ----------------------------------------------------------
            echo "🔄 Updating repository..."
            cd "$REPO"
            git fetch origin main
            git reset --hard origin/main

            # ----------------------------------------------------------
            # 📂 Sync backend files (exclude sensitive and cache dirs)
            # ----------------------------------------------------------
            echo "📂 Syncing backend files to application directory..."
            rsync -az --delete-delay \
              --exclude=.env \
              --exclude=storage/ \
              --exclude=vendor/ \
              --exclude=.git/ \
              "$REPO/backend/" \
              "$APP/"

            cd "$APP"

            # ----------------------------------------------------------
            # 📦 Composer dependencies (only if composer files changed)
            # ----------------------------------------------------------
            if [ "$COMPOSER" = "true" ]; then
              echo "📦 Installing/updating Composer dependencies..."
              php ~/composer.phar install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --no-interaction
            else
              echo "⏩ Composer skipped (no changes in composer files)."
            fi

            # ----------------------------------------------------------
            # ⚙️ Cache configuration (if config/bootstrap changed)
            # ----------------------------------------------------------
            if [ "$RUN_CONFIG" = "true" ]; then
              echo "⚙️ Caching configuration..."
              php artisan config:cache
            else
              echo "⏩ Config cache skipped."
            fi

            # ----------------------------------------------------------
            # 🛣️ Cache routes (if routes changed)
            # ----------------------------------------------------------
            if [ "$RUN_ROUTES" = "true" ]; then
              echo "🛣️ Caching routes..."
              php artisan route:cache
            else
              echo "⏩ Route cache skipped."
            fi

            # ----------------------------------------------------------
            # 🖼️ Cache Blade views (if views changed)
            # ----------------------------------------------------------
            if [ "$RUN_VIEWS" = "true" ]; then
              echo "🖼️ Caching Blade views..."
              php artisan view:cache
            else
              echo "⏩ View cache skipped."
            fi

            # ----------------------------------------------------------
            # 🗄️ Run database migrations (if migrations changed)
            # ----------------------------------------------------------
            if [ "$RUN_MIGRATE" = "true" ]; then
              echo "🗄️ Running database migrations..."
              php artisan migrate --force
            else
              echo "⏩ Migrations skipped."
            fi

            # ----------------------------------------------------------
            # 🔄 Restart queue workers (if Jobs/Listeners changed)
            # ----------------------------------------------------------
            if [ "$RUN_QUEUE" = "true" ]; then
              echo "🔄 Restarting queue workers..."
              php artisan queue:restart || true
            else
              echo "⏩ Queue restart skipped."
            fi

            # ----------------------------------------------------------
            # 🔐 Set correct permissions
            # ----------------------------------------------------------
            echo "🔐 Setting directory permissions..."
            chmod -R 775 storage bootstrap/cache

            # ----------------------------------------------------------
            # ✅ Done
            # ----------------------------------------------------------
            echo "✅ Deployment completed successfully!"
