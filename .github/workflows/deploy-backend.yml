name: Deploy Laravel Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      composer: ${{ steps.changes.outputs.composer }}
      migrate: ${{ steps.changes.outputs.migrate }}
      config: ${{ steps.changes.outputs.config }}
      routes: ${{ steps.changes.outputs.routes }}
      views: ${{ steps.changes.outputs.views }}
      queue: ${{ steps.changes.outputs.queue }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: changes
        name: Detect Changed Backend Files
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD)

          echo "=============================="
          echo "Changed files:"
          echo "$CHANGED"
          echo "=============================="

          composer=false
          migrate=false
          config=false
          routes=false
          views=false
          queue=false

          while IFS= read -r file; do
            case "$file" in
              backend/composer.json|backend/composer.lock)
                composer=true
                ;;
              backend/database/migrations/*)
                migrate=true
                ;;
              backend/config/*|backend/bootstrap/*)
                config=true
                ;;
              backend/routes/*)
                routes=true
                ;;
              backend/resources/views/*)
                views=true
                ;;
              backend/app/Jobs/*|backend/app/Listeners/*)
                queue=true
                ;;
            esac
          done <<< "$CHANGED"

          echo "composer=$composer" >> $GITHUB_OUTPUT
          echo "migrate=$migrate" >> $GITHUB_OUTPUT
          echo "config=$config" >> $GITHUB_OUTPUT
          echo "routes=$routes" >> $GITHUB_OUTPUT
          echo "views=$views" >> $GITHUB_OUTPUT
          echo "queue=$queue" >> $GITHUB_OUTPUT

  deploy:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Namecheap
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAMECHEAP_SSH_HOST }}
          username: ${{ secrets.NAMECHEAP_SSH_USER }}
          key: ${{ secrets.NAMECHEAP_SSH_KEY }}
          port: 21098
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          
          script: |
            set -ex

            COMPOSER="${{ needs.detect.outputs.composer }}"
            RUN_MIGRATE="${{ needs.detect.outputs.migrate }}"
            RUN_CONFIG="${{ needs.detect.outputs.config }}"
            RUN_ROUTES="${{ needs.detect.outputs.routes }}"
            RUN_VIEWS="${{ needs.detect.outputs.views }}"
            RUN_QUEUE="${{ needs.detect.outputs.queue }}"

            REPO="/home/mytijaaracp/repo"
            APP="/home/mytijaaracp/api"

            echo "========================================"
            echo "🚀 MyTijaara Backend Deployment Started"
            echo "========================================"

            cd "$REPO"
            git fetch origin main
            git reset --hard origin/main

            rsync -az --delete-delay --checksum \
              --exclude=".env" \
              --exclude="storage/" \
              --exclude="vendor/" \
              --exclude=".git/" \
              "$REPO/backend/" \
              "$APP/"

            cd "$APP"
            echo "✅ Backend synced."

            # --- Debug environment ---
            echo "--- PHP ---"
            php -v || echo "php not found"
            echo "--- Composer ---"
            ls -la ~/composer.phar || echo "composer.phar missing"
            which composer || echo "composer not in PATH"
            echo "--- Current directory ---"
            pwd
            echo "--- Artisan exists? ---"
            ls -la artisan

            # --- Composer ---
            if [ "$COMPOSER" = "true" ]; then
              echo "📦 Installing Composer dependencies..."
              # Use full path if needed, e.g. /usr/bin/php
              php ~/composer.phar install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --no-interaction
              echo "✅ Composer completed."
            else
              echo "⏩ Composer skipped."
            fi

            # --- Config, Routes, Views ---
            if [ "$RUN_CONFIG" = "true" ]; then
              php artisan config:cache
            else
              echo "⏩ Config cache skipped."
            fi

            if [ "$RUN_ROUTES" = "true" ]; then
              php artisan route:cache
            else
              echo "⏩ Route cache skipped."
            fi

            if [ "$RUN_VIEWS" = "true" ]; then
              php artisan view:cache
            else
              echo "⏩ View cache skipped."
            fi

            # --- Migration ---
            if [ "$RUN_MIGRATE" = "true" ]; then
              php artisan migrate --force
            else
              echo "⏩ No migrations to run."
            fi

            # --- Queue ---
            if [ "$RUN_QUEUE" = "true" ]; then
              php artisan queue:restart || true
            else
              echo "⏩ Queue restart skipped."
            fi

            # --- Permissions ---
            chmod -R 775 storage bootstrap/cache

            echo "========================================"
            echo "🎉 Deployment completed successfully!"
            echo "========================================"